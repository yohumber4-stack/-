name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SIZE: '1843616'
      EXPECTED_SHA256: c6e41b3b9d2005a0d658f8decdfffcb3c628ab7a3e40bb6e332598225d6d815d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The repo has no linter, so check that every script at least parses.
      - name: Syntax check
        run: for f in tests/*.mjs tools/*.mjs; do node --check "$f"; done

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Rebuild release and compare size and SHA-256
        run: |
          npm run release
          actual_size=$(stat -c %s TheLongRoad.html)
          actual_sha=$(sha256sum TheLongRoad.html | cut -d' ' -f1)
          echo "size=$actual_size sha256=$actual_sha"
          if [ "$actual_size" != "$EXPECTED_SIZE" ]; then
            echo "::error::TheLongRoad.html size $actual_size != $EXPECTED_SIZE"
            exit 1
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA256" ]; then
            echo "::error::TheLongRoad.html SHA-256 $actual_sha != $EXPECTED_SHA256"
            exit 1
          fi

      # Regression guard: the harness must not depend on ~/.agent-browser.
      - name: Harness runs with an empty HOME
        run: |
          empty_home="$RUNNER_TEMP/empty-home"
          mkdir -p "$empty_home"
          HOME="$empty_home" node tests/run.mjs tests/harness.mjs --out "$RUNNER_TEMP/artifacts"
